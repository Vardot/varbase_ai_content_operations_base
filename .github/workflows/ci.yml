# Continuous integration for the Varbase AI Content Operations Base recipe.
#
# The repository is private, so this runs on GitHub Actions rather than the
# drupal.org GitLab templates the public Varbase recipes use. Two jobs:
#
#   lint    composer.json, every YAML file and the PHP test script.
#   recipe  a real Varbase 11 site, built as Vardot's public recipe CI builds
#           one (drupal/varbase_project 11.0.x-dev, installed from Varbase
#           Starter). Require this checkout, apply the recipe twice (it must be
#           safe to re-apply) and run tests/verify.php, which needs no AI key.
#           Then it serves the site and runs the functional suite in
#           tests/features (Playwright + Cucumber through @vardot/varbase-e2e)
#           in Chromium.

name: CI

on:
  push:
    branches: ['1.0.x']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  DRUPAL_CORE: '~11.4.0'
  RECIPE: varbase_ai_content_operations_base
  PACKAGE: vardot/varbase_ai_content_operations_base
  COMPOSER_NO_INTERACTION: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(set(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True) + glob.glob('.github/**/*.yml', recursive=True)))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  bad += 1
          print(f'{len(files)} YAML files checked, {bad} with errors')
          sys.exit(1 if bad else 0)
          PY

      - name: No PHP in the recipe
        run: |
          # A recipe ships config only: no .php, .module, .install or .inc file.
          found=$(find . -path ./.git -prune -o -path ./vendor -prune -o -path ./node_modules -prune -o -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' \) -print)
          if [ -n "$found" ]; then echo "::error::PHP files found: $found"; exit 1; fi
          echo 'No PHP files.'

  recipe:
    name: Apply on a Varbase 11 site (Varbase Starter)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A throw-away test site. Composer 2.9 refuses packages with open security
      # advisories, and since 8 October 2026 every enshrined/svg-sanitize release,
      # which Varbase Media Base needs through svg_image, has one. Production
      # sites decide on advisories themselves; this site only has to build.
      COMPOSER_NO_SECURITY_BLOCKING: '1'
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe


      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, pdo_mysql, mysqli, mbstring, intl, zip, bcmath, opcache, pcntl
          # As a served site runs: assertions off (Vardot's recipe CI does the
          # same, for an upstream SDC prop mismatch in media rendering).
          ini-values: memory_limit=-1, zend.assertions=-1
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('recipe/composer.json') }}
          restore-keys: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Build a Varbase 11 site that requires this checkout
        run: |
          # The Varbase project template, as Vardot's public recipe CI uses it,
          # with Varbase's curated patches. Retried: drupal.org clones can reset.
          for i in 1 2 3; do
            composer create-project drupal/varbase_project:11.0.x-dev site --no-install --no-interaction --no-scripts --ignore-platform-req=ext-pgsql && break
            echo "create-project attempt $i failed, retrying"; rm -rf site; sleep 20
          done
          cd site
          # Temporary pin. vardot/varbase-patches 11.0.48 (8 October 2026) re-rolled
          # the tagify #3555084 patch (MR 270) against a base no tagify release
          # matches, so composer-patches, which uses git apply, cannot apply it
          # to tagify 1.2.53, 1.2.54 or 1.2.55. 11.0.47's patch (MR 177) applies
          # to tagify up to 1.2.54. Drop both pins once the patch is re-rolled.
          composer require --no-update vardot/varbase-patches:11.0.47 drupal/tagify:1.2.54
          composer config minimum-stability dev
          composer config repositories.recipe "{\"type\": \"path\", \"url\": \"../recipe\", \"options\": {\"symlink\": false, \"versions\": {\"${PACKAGE}\": \"1.0.x-dev\"}}}"
          composer config --json extra.drupal-recipe-unpack.ignore "[\"${PACKAGE}\"]"
          # Twig stays below 3.30, which
          # breaks the cva module Varbase uses (as Vardot's recipe CI pins it).
          for i in 1 2 3; do
            composer require "${PACKAGE}:1.0.x-dev" "twig/twig:<3.30" -W --no-interaction --ignore-platform-req=ext-pgsql && break
            echo "require attempt $i failed, retrying"; sleep 15
          done
          test -d web/core
          composer show --no-ansi | grep -E 'drupal/(core|canvas|ai|ai_search|ai_agents|tool|tool_belt|gin|varbase_starter|vartheme_bs5) |vardot/|twig/twig |drupal/tagify '

      - name: Patch core 2741429, as Vardot's recipe CI does
        working-directory: site
        run: |
          # A guard for a NULL view mode in EntityDisplayBase that a Varbase
          # install can hit before vardot/varbase-patches is active.
          curl -fsSL -o /tmp/2741429.patch "https://raw.githubusercontent.com/Vardot/drupal-core-patches/refs/heads/patches/drupal-core--2026-07-02--2741429--entitydisplaybase-null-mode-entity.patch"
          if patch -p1 -d web --forward --dry-run < /tmp/2741429.patch; then
            patch -p1 -d web --forward < /tmp/2741429.patch
          else
            echo "core 2741429 already applied"
          fi

      - name: Install Varbase Starter
        working-directory: site
        run: |
          bin/drush site:install "$PWD/recipes/varbase_starter" --db-url=mysql://root:root@127.0.0.1:3306/drupal \
            --account-name=admin --account-pass=admin --site-name="Recipe CI" --locale=en -y
          bin/drush cr

      - name: Apply the recipe
        working-directory: site
        run: |
          bin/drush recipe "$PWD/recipes/${RECIPE}"
          bin/drush cr

      - name: Apply the recipe again
        working-directory: site
        run: bin/drush recipe "$PWD/recipes/${RECIPE}"

      - name: Check the recipe without an AI key
        working-directory: site
        run: |
          # The checks run inline: the recipe ships no PHP file. Each prints PASS or FAIL,
          # then RESULT, and a failure throws so that drush exits non-zero.
          bin/drush php:eval "$(cat <<'PHP'
          // Optional arguments of the old tests/verify.php; CI passes only these.
          $extra = [];
          $failed = FALSE;
          $check = function (string $label, bool $ok, string $detail = '') use (&$failed): void {
            if (!$ok) {
              $failed = TRUE;
            }
            echo sprintf("%-4s %s%s\n", $ok ? 'PASS' : 'FAIL', $label, $detail !== '' ? " ($detail)" : '');
          };

          $module_handler = \Drupal::moduleHandler();
          foreach (['ai', 'ai_agents', 'ai_assistant_api', 'ai_chatbot', 'tool', 'tool_ai_connector', 'tool_belt', 'tool_belt_content', 'tool_belt_entity'] as $module) {
            $check("module $module enabled", $module_handler->moduleExists($module));
          }

          // The agent and its tools.
          $etm = \Drupal::entityTypeManager();
          $agent = $etm->getStorage('ai_agent')->load('varbase_ai_content_operations');
          $check('agent varbase_ai_content_operations exists', (bool) $agent);
          $expected_tools = [
            'tool:tool_belt:entity_list',
            'ai_agent:list_content_entities',
            'tool:tool_belt:entity_load_by_property',
            'tool:tool_belt:entity_bundle_list',
            'tool:tool_belt:entity_load_by_id',
            'tool:tool_belt:entity_field_values',
            'tool:tool_belt:entity_update',
          ];
          if ($agent) {
            $tools = array_keys(array_filter($agent->get('tools') ?? []));
            sort($tools);
            $want = $expected_tools;
            sort($want);
            $check('agent has exactly its seven content tools', $tools === $want, implode(', ', $tools));
            // Tools that delete, create or change the content model or configuration.
            $risky = array_filter($tools, fn($t) => preg_match('/delete|entity_create|entity_save|entity_stub|bundle_add|bundle_update|field_add|field_update|field_storage|field_set_value|automator|config/', $t));
            $check('agent has no tool that deletes or changes the content model', !$risky, implode(', ', $risky));
            $prompt = (string) $agent->get('system_prompt');
            $check('prompt saves only after approval', str_contains($prompt, 'Save only after the editor clearly says yes'));
            $check('prompt ignores a yes for changes not yet shown', str_contains($prompt, 'A yes counts only for changes you have already shown'));
            $check('prompt keeps the text format', str_contains($prompt, 'Never choose a format yourself'));
            $check('prompt never deletes', str_contains($prompt, 'Never delete anything'));
          }
          $function_calls = \Drupal::service('plugin.manager.ai.function_calls');
          foreach ($expected_tools as $tool) {
            $check("function call $tool is available", $function_calls->hasDefinition($tool));
          }

          // The assistant and who may use it.
          $assistant = $etm->getStorage('ai_assistant')->load('varbase_ai_content_operations');
          $check('assistant varbase_ai_content_operations exists', (bool) $assistant);
          if ($assistant) {
            $check('assistant runs the agent', $assistant->get('ai_agent') === 'varbase_ai_content_operations');
            $roles = array_keys(array_filter($assistant->get('roles') ?? []));
            foreach (['content_editor', 'content_admin', 'seo_admin', 'site_admin'] as $role) {
              $check("assistant open to $role", in_array($role, $roles, TRUE));
            }
            foreach (['anonymous', 'authenticated'] as $role) {
              $check("assistant closed to $role", !in_array($role, $roles, TRUE));
            }
          }

          // The toolbar block in the admin theme.
          $block = $etm->getStorage('block')->load('gin_varbase_ai_content_operations');
          $check('block in the Gin toolbar', $block && $block->getTheme() === 'gin' && ($block->get('settings')['placement'] ?? '') === 'toolbar');
          if ($block) {
            $check('block runs the assistant', ($block->get('settings')['plugin_configuration']['assistant_id'] ?? '') === 'varbase_ai_content_operations');
            $visible = array_keys(array_filter($block->getVisibility()['user_role']['roles'] ?? []));
            $check('block shown only to editorial roles', $visible && !array_intersect($visible, ['anonymous', 'authenticated']), implode(', ', $visible));
          }

          // Permissions.
          foreach (['content_editor', 'content_admin', 'seo_admin', 'site_admin'] as $rid) {
            $role = \Drupal\user\Entity\Role::load($rid);
            $check("$rid may use the chat", $role && $role->hasPermission('access deepchat api'));
          }
          $check('anonymous may not use this assistant through the chat', !in_array('anonymous', array_keys(array_filter($assistant?->get('roles') ?? [])), TRUE));

          // The save tool keeps the editor's own permissions: an anonymous visitor
          // cannot update content through it.
          $node_ids = \Drupal::entityQuery('node')->accessCheck(FALSE)->range(0, 1)->execute();
          if ($node_ids) {
            $nid = (int) reset($node_ids);
            $switcher = \Drupal::service('account_switcher');
            $switcher->switchTo(new \Drupal\Core\Session\AnonymousUserSession());
            $tool = \Drupal::service('plugin.manager.tool')->createInstance('tool_belt:entity_update');
            $tool->setInputValue('entity_type_id', 'node');
            $tool->setInputValue('entity_id', $nid);
            $tool->setInputValue('base_fields', ['title' => 'verify.php must not save this']);
            $allowed = $tool->access(NULL, FALSE);
            $switcher->switchBack();
            $check('entity_update refuses an account without edit access', !$allowed, "node $nid");
            $check('node title unchanged', \Drupal\node\Entity\Node::load($nid)->label() !== 'verify.php must not save this');
          }
          else {
            echo "INFO no content yet, so the access check of entity_update was skipped\n";
          }

          // Optional: one real question, as a given user.
          $args = $extra ?? [];
          if (($args[0] ?? '') === 'ask' && isset($args[1], $args[2])) {
            $account = \Drupal\user\Entity\User::load((int) $args[1]);
            \Drupal::service('account_switcher')->switchTo($account);
            $runner = \Drupal::service('plugin.manager.ai_agents')->createInstance('varbase_ai_content_operations');
            $runner->setChatInput(new \Drupal\ai\OperationType\Chat\ChatInput([new \Drupal\ai\OperationType\Chat\ChatMessage('user', $args[2])]));
            $provider = \Drupal::service('ai.provider');
            $default = $provider->getDefaultProviderForOperationType('chat_with_tools') ?: $provider->getDefaultProviderForOperationType('chat');
            $runner->setAiProvider($provider->createInstance($default['provider_id']));
            $runner->setModelName($default['model_id']);
            $runner->setAiConfiguration(['max_tokens' => 8192, 'temperature' => 0.2]);
            $runner->setCreateDirectly(TRUE);
            $runner->determineSolvability();
            $answer = $runner->solve();
            echo "\nAs {$account->getDisplayName()}, with {$default['provider_id']}/{$default['model_id']}:\n\n", is_string($answer) ? $answer : json_encode($answer), "\n";
            $check('the agent answered', is_string($answer) && trim($answer) !== '');
          }

          echo $failed ? "RESULT: FAIL\n" : "RESULT: PASS\n";
          if ($failed) {
            throw new \RuntimeException('Varbase AI Content Operations Base checks failed.');
          }
          PHP
          )"

      - name: Serve the site for the functional tests
        working-directory: site
        run: |
          # The Webmaster in cucumber.shared.js is uid 1.
          bin/drush php:eval '$u = \Drupal\user\Entity\User::load(1); $u->setUsername("webmaster"); $u->setEmail("webmaster@example.test"); $u->setPassword("dD.123123ddd"); $u->save();'
          # Headless test prep, as Vardot's recipe CI does on Varbase sites.
          bin/drush pm:uninstall antibot big_pipe seckit -y || true
          bin/drush config:set system.performance css.preprocess 0 -y
          bin/drush config:set system.performance js.preprocess 0 -y
          bin/drush cr
          # Drupal expects the docroot as the working directory: from anywhere else
          # plugin discovery finds nothing and every page is a 500.
          (cd web && PHP_CLI_SERVER_WORKERS=8 nohup php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/user/login && break; sleep 2; done
          curl -s -o /dev/null -w 'user/login: HTTP %{http_code}\n' http://127.0.0.1:8080/user/login

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the functional tests (Playwright + Cucumber)
        working-directory: recipe
        env:
          LAUNCH_URL: http://127.0.0.1:8080
        run: |
          echo "nodeLinker: node-modules" > .yarnrc.yml
          corepack enable
          # varbase-e2e's postinstall can rewrite cucumber.js; keep ours.
          cp cucumber.js /tmp/cucumber.js.bak
          yarn install
          cp /tmp/cucumber.js.bak cucumber.js
          ./node_modules/.bin/playwright install --with-deps chromium
          yarn test

      - name: Keep the test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-tests
          path: |
            recipe/tests/reports/
            recipe/tests/screenshots/
            /tmp/php-server.log
          if-no-files-found: ignore
